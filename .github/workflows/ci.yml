name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # What a plugin user gets: the launcher installs runtime dependencies itself in a clean checkout.
      - run: node bin/ritoko.mjs list
        env:
          RITOKO_HOME: ${{ runner.temp }}/ritoko-home
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  e2e:
    name: e2e, real Chrome (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner images ship Google Chrome, which chromePath() in src/engine/browser.ts finds by itself
      # (/usr/bin/google-chrome, C:\Program Files\Google\Chrome\..., /Applications/Google Chrome.app). RITOKO_CHROME_PATH is not needed.
      - run: pnpm test:e2e
