name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 10 --json conclusion,status --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          test "$result" -gt 0 || { echo "CI has not passed for $GITHUB_SHA"; exit 1; }
      - run: npm run release:check
      - name: Require published npm package and matching namespace
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const published = JSON.parse(execFileSync('npm', ['view', `${pkg.name}@${pkg.version}`, '--json', '--registry=https://registry.npmjs.org'], {encoding: 'utf8'}))
          assert.equal(published.version, pkg.version)
          assert.equal(published.mcpName, pkg.mcpName)
          JS
      - name: Install pinned official publisher
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mcp-publisher.tar.gz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate manifest
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'
      - name: Authenticate with GitHub OIDC
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish manifest
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
